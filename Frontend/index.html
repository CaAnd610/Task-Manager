<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaisei+Opti&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
</head>
<body>
    <div class="line decoration-line-1"></div>
    <div class="line decoration-line-2"></div>
    <div class="line decoration-line-3"></div>
    <div class="line decoration-line-4"></div>
    <dialog class="signup-modal">
        <p class="signup-modal__text">Su cuenta ha sido creada exitosamente, ahora puede iniciar sesión en ella</p>
        <button class="btn signup-modal__btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17 17L7 7.00002M17 7L7.00001 17" stroke="black" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
    </dialog>
    <main>
        <section class="form-section">
            <header class="login_header">
                <img src="assets/images/Astra.png" alt="Imagen" class="form-img">
                <h1 class="login-title">Task Manager</h1>
            </header>
            <form class="login-form">
                <h2 class="login-form__tittle">Inicia Sesión en tu cuenta</h2>
                <div class="login-form__email-container">
                    <input type="email" class="input login-form__user" placeholder="Email" required>
                </div>
                <div class="login-form__password-container">
                    <input type="password" class="input login-form__password" placeholder="Contraseña" required>
                    <button  type = "button" class="btn login-form__show-password-button">
                        <img src="./assets/icons/showed-eye.svg" alt="Mostrar contraseña" class="login-form__show-password-button-img">
                    </button>
                    <button type = "button" class="btn login-form__hide-password-button hide">
                        <img src="./assets/icons/closed-eye.svg" alt="Ocultar contraseña" class="login-form__hide-password-button-img">
                    </button>
                </div>
                <div class="form_error-container">
                    <span class="form_error-text"></span>
                </div>
                <button type="submit" class="btn login-form__button">Iniciar Sesión</button>
                <div class="login-form__line">
                    <span class="login-form__line-text">Ó Creala</span>
                </div>
                <button type="button" class="btn login-form__signup-button"><a href="Pages/signup.html">Crea una cuenta</a></button>
                <img src="assets/icons/Star 1.png" alt="Estrella decorativa" class="form_star">
            </form>
            <span class="form-footer">Bienvenido a <b>Astra</b></span>
        </section>
    </main>

    <script type = "module" src="./js/Pages/login.js"></script>
</body>
</html>
