<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/events.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italianno&family=Kaisei+Opti&family=Kapakana:wght@300..400&family=Ledger&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav-bar">
        <h2 class="nav-bar__tittle"><a href="./dashboard.html">Astra</a></h2>
        <h4 class="nav-bar__element"><a href="./events.html">Tus eventos</a></h4>
        <h4 class="nav-bar__element"><a href="./flashcards.html">Flashcards</a></h4>
        <h4 class="nav-bar__element"><a href="./schedule.html">Horario</a></h4>
        <h4 class="nav-bar__element"><a href="./study-sessions.html">Sesiones de estudio</a></h4>
    </nav>
    <main>
        <header class="header">
            <div class="header-intro">
                <div class="upper-header__text">
                    <h2 class="upper-header__text-tittle">Bienvenido</h2>
                    <p class="upper-header__text-intro">Tus eventos - Gestiona tus tareas, exámenes y compromisos académicos</p>
                </div>
                <button class="upper-header__create-event btn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 12H20M12 4V20" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Añadir nuevo evento
                </button>
            </div>
            <div class="header-advices">
                <div class="header-advices__advice">
                    <span class="header-advices__advice-text ">Total pendientes</span>
                    <span class="header-advices__advice-text">5</span>
                </div>
                <div class="header-advices__advice">
                    <span class="header-advices__advice-text today-advice">Vence Hoy</span>
                    <span class="header-advices__advice-text today-advice-number">5</span>
                </div>
                <div class="header-advices__advice">
                    <span class="header-advices__advice-text">Esta semana</span>
                    <span class="header-advices__advice-text">5</span>
                </div>
            </div>
        </header>
        <section class="filters-section">
            <div class="filters__time-filters">
                <div class="time-filters__times-selection">
                    <button class="times-selection__filter">Hoy</button>
                    <button class="times-selection__filter">Esta semana</button>
                    <button class="times-selection__filter">Este mes</button>
                    <button class="times-selection__filter">Todos</button>
                </div>
                <div class="time-filters__order-by">
                    <label for="order-by__select" class="order-by__label">Ordenar por:</label>
                    <select name="order-by-filter" class="order-by__select">
                        <option value="nearest">Fecha de entrega(Más Próximo primero)</option>
                        <option value="subject">Materia (A-Z)</option>
                        <option value="priority">Prioridad mas alta</option>
                    </select>
                </div>
            </div>
            <div class="filters__filters-controls">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <input type="text" class="filters-controls__search-input" placeholder="Buscar eventos, materias o títulos...">
                <select name="subjects-filter" id="subjects-filter" class="filters-controls__subject-filter">
                    <option value="all-subjects" class="subject-filter__option">Todas las materias</option>
                    <option value="español" class="subject-filter__option">español</option>
                    <option value="ingles" class="subject-filter__option">Inglés</option>
                </select>
                <select name="type-filter" id="type-filter" class="filters-controls__type-filter">
                    <option value="all-types" class="type-filter__option">Todos los tipos</option>
                    <option value="Homework" class="type-filter__option">Tareas</option>
                    <option value="Exam" class="type-filter__option">Examen</option>
                </select>
            </div>
        </section>

    </main>
</body>
</html>
